<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your way — Garissa University campus map</title>
  <meta name="description" content="Pick where you are and where you're going at Garissa University, and get walking directions.">
  <meta name="theme-color" content="#008000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="48x48" href="images/brand/favicon-48.png">
  <link rel="apple-touch-icon" href="images/brand/gau-seal-180.png">
  <link rel="stylesheet" href="css/style.css?v=20261118c">
</head>
<body>

  <header class="head">
    <span class="logo" role="img" aria-label="Garissa University (Oasis of Innovation)"><img class="logo__seal" src="images/brand/gau-seal-96.png" alt="" width="38" height="38"><span class="logo__word"></span></span>
    <h1 data-i18n="title">Find your way</h1>
    <p class="lead" data-i18n="lead">Choose where you are and where you're going.</p>
  </header>

  <main class="main">
    <form class="picker" aria-label="Route">
      <div class="picker__field">
        <label for="from" data-i18n="from">You are at</label>
        <select id="from" name="from"></select>
      </div>
      <button type="button" class="picker__swap" id="swap" aria-label="Swap start and destination">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>
      </button>
      <div class="picker__field">
        <label for="to" data-i18n="to">Going to</label>
        <select id="to" name="to"></select>
      </div>
    </form>

    <p class="summary" id="summary" role="status" aria-live="polite"></p>
    <p class="hint" data-i18n="hint">Tip: tap a dot on the map to pick that place.</p>

    <div class="mapbox">
      <svg id="map" class="map" role="img" aria-labelledby="map-title" preserveAspectRatio="xMidYMid meet">
        <title id="map-title">Garissa University campus map</title>
        <g id="layer-paths"></g>
        <g id="layer-route"></g>
        <g id="layer-dots"></g>
        <g id="layer-labels"></g>
      </svg>
    </div>
    <ul class="legend">
      <li><svg width="28" height="10" aria-hidden="true"><line x1="2" y1="5" x2="26" y2="5" class="legend__road"/></svg><span data-i18n="legendRoad">Main road</span></li>
      <li><svg width="28" height="10" aria-hidden="true"><line x1="2" y1="5" x2="26" y2="5" class="legend__path"/></svg><span data-i18n="legendPath">Pathway</span></li>
    </ul>
    <button type="button" class="mapbtn" id="full" data-i18n="full">Show whole campus</button>

    <section class="steps" aria-labelledby="steps-title">
      <h2 id="steps-title" data-i18n="directions">Directions</h2>
      <ol id="steps"></ol>
      <noscript><p data-i18n="nojs">Turn on JavaScript to get directions.</p></noscript>
    </section>
  </main>

  <footer class="foot">
    <a class="btn" href="https://gau.ac.ke" rel="noopener" data-i18n="official">Official website: gau.ac.ke</a>
    <p class="credit">Layout based on the GaU campus layout map · Built by The Stonecoders</p>
  </footer>

  <script src="js/i18n.js?v=20261118c"></script>
  <script src="js/data.js?v=20261118c"></script>
  <script src="js/map.js?v=20261118c"></script>

  <!-- Scan counter: GoatCounter (cookieless). QR scans arrive tagged ?campaign=…&ref=qr -->
  <script data-goatcounter="https://majid.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
