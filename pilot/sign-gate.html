<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gate sign: GaU campus map</title>
  <!-- Source for sign-gate.pdf (A4). The QR pre-fills "You are at: Main Gate". -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 210mm; height: 297mm; background: #F7F5EF; color: #1A1F1C;
      font-family: "DM Sans", Arial, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 18mm 16mm 14mm; }
    .top { text-align: center; }
    .eyebrow { font-weight: 700; letter-spacing: 3px; font-size: 13pt; color: #14532D; text-transform: uppercase; }
    h1 { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 800; font-size: 50pt; line-height: 1; margin: 6mm 0 4mm; }
    .sub { font-size: 16pt; color: #4F5753; margin: 0; }
    .qr { background: #fff; border-radius: 8mm; padding: 8mm; box-shadow: 0 0 0 1.2mm #14532D; }
    .qr img { display: block; width: 125mm; height: 125mm; }
    .steps { display: flex; gap: 10mm; font-size: 13pt; color: #4F5753; }
    .steps b { color: #14532D; }
    .foot { text-align: center; font-size: 10pt; color: #4F5753; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">Garissa University · Main Gate</div>
    <h1>Find your way.</h1>
    <p class="sub">Scan for walking directions to any office, hall or hostel</p>
  </div>
  <div class="qr"><img src="qr-map-gate.svg" alt="QR code to the GaU campus map"></div>
  <div class="steps"><span><b>1</b> Scan</span><span><b>2</b> Pick where you're going</span><span><b>3</b> Follow the orange line</span></div>
  <div class="foot">Pilot by The Stonecoders · [Approved by / date]<br>majidtech25.github.io/gau-campus-map</div>
</body>
</html>
